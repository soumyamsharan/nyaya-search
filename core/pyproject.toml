[project]
name = "nyaya-core"
version = "0.1.0"
description = "Shared domain, parsing, search, grounding and LLM code for Nyaya Search"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pymupdf>=1.25,<2",
    "numpy>=1.26,<3",
    "sentence-transformers[onnx]>=4.1,<6",
    "httpx>=0.27,<1",
    "pyarrow>=18,<23",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyaya"]
