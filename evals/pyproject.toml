[project]
name = "nyaya-evals"
version = "0.1.0"
description = "Retrieval evaluation runner"
requires-python = ">=3.12,<3.13"
dependencies = ["nyaya-core", "pyyaml>=6,<7", "typer>=0.12,<1"]

[project.scripts]
evals = "nyaya_evals.runner:app"

[tool.uv.sources]
nyaya-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyaya_evals"]
