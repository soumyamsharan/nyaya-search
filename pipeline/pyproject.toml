[project]
name = "nyaya-pipeline"
version = "0.1.0"
description = "Ingestion CLI: sync, extract, index, citations"
requires-python = ">=3.12,<3.13"
dependencies = ["nyaya-core", "typer>=0.12,<1"]

[project.scripts]
pipeline = "nyaya_pipeline.cli:app"

[tool.uv.sources]
nyaya-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyaya_pipeline"]
